name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # Warn-only: don't fail the build on style findings
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck -S error || echo "::warning::shellcheck reported issues"
